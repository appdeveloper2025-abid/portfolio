<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABID MEHMOOD | Professional Card</title>
    <link rel="icon" type="image/jpeg" href="My%20Picture.JPG">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #020008 0%, #1a0f2e 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 245, 255, 0.2);
            border-color: #00f5ff;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .page-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #00f5ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .business-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            padding: 35px;
            width: 480px;
            height: 300px;
            margin: 0 auto 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 2;
        }

        .name-info h2 {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .name-info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-pic {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            object-fit: cover;
            object-position: top center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .card-content {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            row-gap: 12px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #ffffff;
            font-weight: 600;
        }

        .contact-row i {
            color: #ffd700;
            width: 16px;
            text-align: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .contact-row span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .button-section {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .download-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #00f5ff, #7b2ff7);
            color: #000000;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 245, 255, 0.5);
            background: linear-gradient(135deg, #7b2ff7, #00f5ff);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .business-card {
                width: 400px;
                height: 260px;
                padding: 30px;
            }
            
            .profile-pic {
                width: 65px;
                height: 65px;
            }
            
            .name-info h2 {
                font-size: 20px;
            }
            
            .contact-row {
                font-size: 11px;
            }
            
            .contact-row span {
                max-width: 120px;
            }
        }

        @media (max-width: 480px) {
            .business-card {
                width: 340px;
                height: 240px;
                padding: 25px;
            }
            
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .contact-row span {
                max-width: 200px;
            }
            
            .button-section {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .download-button {
                width: 180px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Portfolio
    </a>

    <div class="container">
        <h1 class="page-title">PROFESSIONAL CARD</h1>
        
        <div class="business-card" id="cardElement">
            <div class="card-top">
                <div class="name-info">
                    <h2>ABID MEHMOOD</h2>
                    <p>Full Stack Developer</p>
                </div>
                <img src="My%20Picture.JPG" alt="Abid" class="profile-pic">
            </div>
            
            <div class="card-content">
                <div class="contact-grid">
                    <div class="contact-row">
                        <i class="fas fa-phone"></i>
                        <span>+92 302 9382306</span>
                    </div>
                    <div class="contact-row">
                        <i class="fas fa-envelope"></i>
                        <span>abidbusiness2025@gmail.com</span>
                    </div>
                    <div class="contact-row">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Lakki Marwat, KPK</span>
                    </div>
                    <div class="contact-row">
                        <i class="fab fa-github"></i>
                        <span>appdeveloper2025-abid</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="button-section">
            <button class="download-button" onclick="downloadPNG()">
                <i class="fas fa-image"></i> PNG
            </button>
            <button class="download-button" onclick="downloadJPG()">
                <i class="fas fa-camera"></i> JPG
            </button>
            <button class="download-button" onclick="downloadPDF()">
                <i class="fas fa-file-pdf"></i> PDF
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="card-download.js"></script>
</body>
</html>
</html>
